# Asserts the iOS share sheet is up with the PDF named ${FILE}..., then closes it
# by tapping outside the sheet.
appId: app.unscratched
---
- extendedWaitUntil:
    visible: "${FILE}.*"
    timeout: 30000
- assertVisible: "PDF Document.*"
- tapOn:
    id: "PopoverDismissRegion"
    point: "50%,10%"
- assertNotVisible: "PDF Document.*"
